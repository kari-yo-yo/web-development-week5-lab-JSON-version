<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>User Profiles</title>
</head>
<body>
    <h1>User Profiles</h1>
    <div id="userList"></div>

    <script>
        fetch('userProfiles.json')
            .then(response => {
                if (!response.ok) throw new Error('Fetch error: ' + response.status);
                return response.json();
            })
            .then(json => {
                const container = document.getElementById('userList');
                json.userProfiles.forEach(user => {
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <h3>${user.firstName} ${user.lastName}</h3>
                        <p>Email: ${user.email}</p>
                        <p>Date of Birth: ${user.dateOfBirth}</p>
                        <p>Address: ${user.address.street}, ${user.address.city}, ${user.address.state} ${user.address.zipCode}</p>
                        <p>Theme: ${user.preferences.theme}</p>
                        <p>Language: ${user.preferences.language}</p>
                        <p>Notifications: ${user.preferences.notifications}</p>
                        <p>Subscription: ${user.preferences.subscription}</p>
                        <hr>
                    `;
                    container.appendChild(div);
                });
            })
            .catch(err => console.error('Fetch error: ' + err.message));
    </script>
</body>
</html>
